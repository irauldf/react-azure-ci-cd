name: React CI/CD to Azure

on:
  push:
    branches:
      - dev

env:
  NODE_VERSION: '22'
  AZURE_WEBAPP_NAME: 'react-webapp'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
      
      - name: Verify Azure credentials secret
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "ERROR: Publish Profile secret is empty or unavailable"
            exit 1
          else
            echo "OK: Publish Profile secret is available"
          fi
          
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./dist